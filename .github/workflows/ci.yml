name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24"
      - run: flutter pub get
      - run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24"
      - run: flutter pub get
      - run: flutter test --coverage --coverage-package=local_llm_app
      - name: Check coverage threshold
        run: |
          if [ -f coverage/lcov.info ]; then
            # Use lcov to check line coverage; fail below 60%
            lcov --summary coverage/lcov.info 2>&1 | head -5
          fi

  todo-check:
    name: Tech Debt Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for TODO/FIXME
        run: |
          echo "=== TODO/FIXME markers ==="
          rg -n "TODO|FIXME|HACK|XXX" --type dart lib/ test/ || echo "No markers found."

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24"
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib/ test/
