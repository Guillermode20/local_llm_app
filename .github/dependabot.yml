version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automerge"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      flutter-dependencies:
        patterns:
          - "flutter*"
          - "dart*"
        update-types:
          - "minor"
          - "patch"
      riverpod:
        patterns:
          - "riverpod*"
          - "flutter_riverpod"
      drift:
        patterns:
          - "drift*"
          - "sqlite3*"
